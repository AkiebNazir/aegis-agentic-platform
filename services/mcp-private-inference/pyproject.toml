[project]
name = "mcp-private-inference"
version = "0.1.0"
description = "Enterprise MCP Server & Air-Gapped vLLM Inference Bridge"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "openai>=1.55.0",
    "httpx>=0.28.0",
    "psutil>=6.1.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"